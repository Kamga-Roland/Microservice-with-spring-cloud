syntax = "proto3";

option java_multiple_files = true;
option java_package = "fr.upec.episen.tp9_stock";

package fr.upec.episen.tp9_stock;

service StockService {
  rpc GetStockByProductId (StockRequest) returns (StockResponse);
}

message StockRequest {
  string productId = 1;
}

message StockResponse {
  string productId = 1;
  int32 quantity = 2;
}